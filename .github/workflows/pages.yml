name: Deploy to GitHub Pages

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'

      # Before the build: its base_url is the site's real address (custom domain included).
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build website
        run: |
          chmod +x build.sh
          ./build.sh BuildWebsite \
            --site-base-url "${{ steps.pages.outputs.base_url }}" \
            --site-title "${GITHUB_REPOSITORY#*/}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: output/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
