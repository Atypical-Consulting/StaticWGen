name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'

      - name: Restore NuGet packages
        run: dotnet restore

      - name: Run tests
        run: dotnet test --project tests/StaticWGen.Tests/StaticWGen.Tests.csproj --verbosity normal

      # Every theme must build and pass Validate (links, a11y, SEO). default goes last so
      # output/ holds the default theme for the checks, the image smoke test and the artifact.
      - name: Build every theme
        run: |
          chmod +x build.sh
          for theme in $(ls themes | grep -vx default) default; do
            echo "::group::theme $theme"
            ./build.sh BuildWebsite --theme "$theme" \
              --site-base-url "https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}" \
              --site-title "${GITHUB_REPOSITORY#*/}"
            echo "::endgroup::"
          done

      - name: Verify generated output
        run: |
          echo "Checking generated files..."
          test -f output/index.html || (echo "ERROR: index.html not found" && exit 1)
          test -f output/sitemap.xml || (echo "ERROR: sitemap.xml not found" && exit 1)
          test -f output/robots.txt || (echo "ERROR: robots.txt not found" && exit 1)
          test -f output/feed.xml || (echo "ERROR: feed.xml not found" && exit 1)
          test -d output/tags || (echo "ERROR: tags directory not found" && exit 1)
          echo "All expected files present."
          echo "Generated files:"
          find output -type f | sort

      - name: Smoke-test the Docker image
        run: bash scripts/smoke-test-image.sh

      # The packaged dotnet tool, installed the way users install it: new site, post, build.
      - name: CLI end to end (staticwgen dotnet tool)
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/StaticWGen.Cli/StaticWGen.Cli.csproj)
          dotnet pack src/StaticWGen.Cli -c Release -o "$RUNNER_TEMP/nupkg"
          dotnet tool install StaticWGen --version "$version" --tool-path "$RUNNER_TEMP/tools" --add-source "$RUNNER_TEMP/nupkg"
          sw="$RUNNER_TEMP/tools/staticwgen"
          cd "$RUNNER_TEMP"
          "$sw" new cli-site --site-title "CLI Site"
          cd cli-site
          "$sw" new-post "Hello CLI" --tags "ci"
          "$sw" build --include-drafts
          grep -q "Hello CLI" output/*-hello-cli.html
          if "$sw" build --no-such-setting x; then echo "unknown setting must fail"; exit 1; fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: website-output
          path: output/
          retention-days: 7

      - name: Upload build report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: build-report
          path: build-report.json
          retention-days: 30

      # Last, because it replaces input/: the README's "Use this template" steps must
      # produce a site that builds and validates with no posts yet.
      - name: Build a fresh site the way the README describes
        run: |
          rm -rf input CHANGELOG.md
          ./build.sh Init --title "My Site" --author "Me"
          ./build.sh BuildWebsite --site-base-url "https://example.github.io/my-site" --site-title "My Site"
