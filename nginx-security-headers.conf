# Included by every location that sets its own add_header: nginx drops server-level
# add_header directives in any block that declares one, so they must be repeated there.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Hosts the themes, the YouTube transformer and the Plausible/GA4 integrations load.
# A custom AnalyticsScriptUrl host must be added here.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' cdn.jsdelivr.net plausible.io www.googletagmanager.com; style-src 'self' 'unsafe-inline' cdn.jsdelivr.net fonts.googleapis.com; font-src 'self' cdn.jsdelivr.net fonts.gstatic.com; img-src 'self' data: https:; frame-src www.youtube-nocookie.com; connect-src 'self' plausible.io www.google-analytics.com;" always;
