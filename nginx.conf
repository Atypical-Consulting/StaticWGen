server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types
        text/html
        text/css
        text/xml
        text/plain
        application/javascript
        application/json
        application/xml
        application/atom+xml
        image/svg+xml;

    # Cache static assets (30 days)
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Cache XML feeds (1 hour)
    location ~* \.(xml)$ {
        expires 1h;
        add_header Cache-Control "public";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Custom error pages
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Serve files, return 404 for missing pages
    location / {
        try_files $uri $uri/ =404;
    }

    # Disable access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
